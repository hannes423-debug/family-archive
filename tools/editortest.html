<!doctype html>
<meta charset="utf-8">
<title>PENDING</title>
<!-- Browser test for the editor. Same-origin with docs/ when the repo root is
     served. Drives the real editing UI and asserts the one invariant that
     matters: a living person cannot acquire a name, a date or a place, by any
     route, and nothing that would break it can be published.

       python3 -m http.server 8199
       google-chrome --headless=new --disable-gpu --virtual-time-budget=25000 \
         --dump-dom http://127.0.0.1:8199/tools/editortest.html | grep -o '<title>[^<]*'
-->
<iframe id="f" src="../docs/index.html" style="width:1400px;height:900px;border:0"></iframe>
<pre id="log"></pre>
<script>
const SUITE = 'editortest';
const results = [];
const ok = (name, cond, extra = '') =>
  results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${extra ? ' :: ' + extra : ''}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function click(el, win) {
  el.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, view: win }));
}
function typeInto(input, win, value) {
  input.value = value;
  input.dispatchEvent(new win.Event('change', { bubbles: true }));
}

(async function run() {
  const frame = document.getElementById('f');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const win = frame.contentWindow;
  const doc = frame.contentDocument;

  // Editing must never be the default: a visitor gets the read-only tree.
  win.localStorage.clear();
  win.sessionStorage.clear();

  for (let i = 0; i < 100 && !doc.querySelector('.node'); i++) await sleep(50);
  for (let i = 0; i < 100 && !win.Editor; i++) await sleep(50);

  const E = win.Editor;
  const T = win.Tree;
  ok('editor loaded', !!E && !!T);
  ok('edit bar hidden until asked', doc.getElementById('editbar').hidden);
  ok('panel is read-only by default', T.onPanel === null);

  // ── a visitor is offered nothing to edit with ─────────────────────────────
  ok('role starts as guest', E.role === 'guest');
  ok('guest sees no edit toggle', doc.getElementById('edit-toggle').hidden);
  ok('guest sees the sign-in key', !doc.getElementById('unlock').hidden);
  click(doc.getElementById('edit-toggle'), win);
  await sleep(60);
  ok('a guest cannot reach edit mode by clicking the hidden toggle',
     T.onPanel === null && doc.getElementById('editbar').hidden);

  const before = T.data.people.length;

  // ── enter edit mode ───────────────────────────────────────────────────────
  // No token here, so the private repository is unreachable and the editor
  // falls back to working on the public tree — which is the mode the rest of
  // this suite asserts against.
  await E.becomeAdmin();
  await sleep(60);
  ok('archivist sees the edit toggle', !doc.getElementById('edit-toggle').hidden);
  ok('archivist sees no sign-in key', doc.getElementById('unlock').hidden);
  ok('without a private repo the working copy stays the public one',
     E.fullRecord === false);
  click(doc.getElementById('edit-toggle'), win);
  await sleep(60);
  ok('edit bar appears', !doc.getElementById('editbar').hidden);
  ok('publish disabled with no changes', doc.getElementById('btn-publish').disabled);

  // ── edit a deceased person: full detail allowed ───────────────────────────
  const dead = T.data.people.find((p) => !p.living);
  T.select(dead.id);
  await sleep(60);
  const body = doc.getElementById('panel-body');
  ok('deceased form offers given names', !!body.querySelector('#f-given'));
  ok('deceased form offers occupation', !!body.querySelector('#f-occupation'));

  typeInto(body.querySelector('#f-occupation'), win, 'kalastaja');
  await sleep(80);
  ok('an edit is recorded',
     T.data.people.find((p) => p.id === dead.id).occupation === 'kalastaja');
  ok('publish enabled once dirty', !doc.getElementById('btn-publish').disabled);

  // ── a living person's form must not offer the forbidden fields ────────────
  const living = T.data.people.find((p) => p.living);
  T.select(living.id);
  await sleep(60);
  ok('living form hides given names', !body.querySelector('#f-given'));
  ok('living form hides occupation', !body.querySelector('#f-occupation'));
  ok('living form hides notes', !body.querySelector('#f-notes'));
  ok('living form hides birth place', !body.querySelector('#f-birthPlace'));
  ok('living form explains why', !!body.querySelector('.redacted'));
  ok('living surname is editable', !!body.querySelector('#f-surname'));

  // ── the invariant: a recent birth date cannot unlock detail ───────────────
  typeInto(body.querySelector('#f-birthDate'), win, '14 MAR 2019');
  await sleep(90);
  const after = T.data.people.find((p) => p.id === living.id);
  ok('a recent birth date does not store a birth record', after.birth === null,
     JSON.stringify(after.birth));
  ok('person stays living after a recent birth date', after.living === true);
  ok('name stays masked', /^Living\b/.test(after.name));

  // ── recording a death is what unlocks detail, and only then ───────────────
  T.select(living.id);
  await sleep(60);
  typeInto(doc.getElementById('f-deathDate'), win, '3 MAR 2024');
  await sleep(90);
  const now = T.data.people.find((p) => p.id === living.id);
  ok('a death date makes the person deceased', now.living === false);
  T.select(living.id);
  await sleep(60);
  ok('given names appear once deceased', !!doc.getElementById('f-given'));

  // Undo it: back to living, and the detail must vanish again.
  typeInto(doc.getElementById('f-deathDate'), win, '');
  await sleep(90);
  T.select(living.id);
  await sleep(60);
  const back = T.data.people.find((p) => p.id === living.id);
  ok('clearing the death date returns them to living', back.living === true);
  ok('detail is stripped on the way back', !back.death && !back.given && !back.occupation);

  // ── adding relatives, including ancestors ─────────────────────────────────
  const root = T.data.people.slice().sort((a, b) => a.generation - b.generation)[0];
  const genBefore = Math.max(...T.data.people.map((p) => p.generation));
  T.select(root.id);
  await sleep(60);
  click([...doc.querySelectorAll('[data-add]')].find((b) => b.dataset.add === 'father'), win);
  await sleep(120);
  ok('adding a father adds a person', T.data.people.length === before + 1);
  const genAfter = Math.max(...T.data.people.map((p) => p.generation));
  ok('the tree grew a generation upward', genAfter === genBefore + 1,
     `${genBefore} -> ${genAfter}`);

  const father = T.data.people.find((p) => p.generation === 0 && p.id !== root.id);
  ok('a new ancestor starts out living (no dates known)',
     T.data.people.some((p) => p.living && p.id !== root.id));

  T.select(root.id);
  await sleep(60);
  click([...doc.querySelectorAll('[data-add]')].find((b) => b.dataset.add === 'child'), win);
  await sleep(120);
  ok('adding a child adds a person', T.data.people.length === before + 2);

  T.select(root.id);
  await sleep(60);
  click([...doc.querySelectorAll('[data-add]')].find((b) => b.dataset.add === 'sibling'), win);
  await sleep(120);
  ok('adding a sibling adds a person', T.data.people.length === before + 3);
  ok('every card still renders', doc.querySelectorAll('.node').length === before + 3);

  // ── undo ──────────────────────────────────────────────────────────────────
  click(doc.getElementById('btn-undo'), win);
  await sleep(120);
  ok('undo removes the last addition', T.data.people.length === before + 2);

  // ── naming an ancestor whose dates are unknown ────────────────────────────
  // This is the workflow the whole feature exists for, and the plain rule
  // ("no death record means living") would otherwise forbid it.
  const anc = T.data.people.find((p) => p.living && p.generation === 0);
  T.select(anc.id);
  await sleep(60);
  const assertBox = doc.getElementById('f-deathAsserted');
  ok('an undated ancestor offers the deceased-date-unknown tick', !!assertBox);

  assertBox.checked = true;
  assertBox.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(100);
  const asserted = T.data.people.find((p) => p.id === anc.id);
  ok('asserting a death makes them deceased', asserted.living === false);
  ok('the assertion carries no invented date',
     asserted.death && asserted.death.asserted === true && !asserted.death.date);

  T.select(anc.id);
  await sleep(60);
  ok('now the ancestor can be named', !!doc.getElementById('f-given'));
  typeInto(doc.getElementById('f-given'), win, 'Matti Aaponpoika');
  typeInto(doc.getElementById('f-surname'), win, 'Vanhatalo');
  await sleep(100);
  const named = T.data.people.find((p) => p.id === anc.id);
  ok('the ancestor keeps the name given', named.name === 'Matti Aaponpoika Vanhatalo',
     named.name);
  ok('their card says the date is unknown, not that it is missing',
     [...doc.querySelectorAll('.node .dt')].some((n) => n.textContent === 'died, date unknown'));

  // Untick: the name must vanish again, because they are living once more.
  T.select(anc.id);
  await sleep(60);
  const box2 = doc.getElementById('f-deathAsserted');
  box2.checked = false;
  box2.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(100);
  const reverted = T.data.people.find((p) => p.id === anc.id);
  ok('unticking returns them to living', reverted.living === true);
  ok('and takes the name back off', !reverted.given && /^Living\b/.test(reverted.name));

  // Put it back so the payload checks below have a named ancestor in them.
  T.select(anc.id);
  await sleep(60);
  const box3 = doc.getElementById('f-deathAsserted');
  box3.checked = true;
  box3.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(100);

  // ── the floor: order of entry must not let a child be published ───────────
  // The dangerous sequence is the other way round from the obvious one: tick
  // "deceased, date unknown" FIRST (which unlocks the fields), then type a
  // recent birth date. A living person's birth date is scrubbed, so the guard
  // has to live in the rule, not in the form.
  const kid = T.data.people.find((p) => p.living && p.generation >= 3);
  T.select(kid.id);
  await sleep(60);
  const kbox = doc.getElementById('f-deathAsserted');
  kbox.checked = true;
  kbox.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(100);
  ok('ticking alone does make an undated person deceased',
     T.data.people.find((p) => p.id === kid.id).living === false);

  T.select(kid.id);
  await sleep(60);
  typeInto(doc.getElementById('f-given'), win, 'Testinimi');
  typeInto(doc.getElementById('f-birthDate'), win, '14 MAR 2019');
  await sleep(120);
  const kidNow = T.data.people.find((p) => p.id === kid.id);
  ok('a recent birth date overrides the bare assertion', kidNow.living === true);
  ok('and the name typed under it is stripped', !kidNow.given, kidNow.given);
  ok('and no birth record survives', !kidNow.birth, JSON.stringify(kidNow.birth));
  ok('their card is masked again', /^Living\b/.test(kidNow.name));

  // A real death date, by contrast, is a specific claim and is honoured.
  T.select(kid.id);
  await sleep(60);
  typeInto(doc.getElementById('f-deathDate'), win, '4 JAN 2024');
  await sleep(120);
  ok('a dated death is still honoured for anyone',
     T.data.people.find((p) => p.id === kid.id).living === false);
  T.select(kid.id);
  await sleep(60);
  typeInto(doc.getElementById('f-deathDate'), win, '');
  await sleep(120);
  ok('clearing it returns them to living and bare',
     T.data.people.find((p) => p.id === kid.id).living === true
     && !T.data.people.find((p) => p.id === kid.id).given);

  // ── attaching photographs ─────────────────────────────────────────────────
  const cat = (T.media && T.media.items) || [];
  if (cat.length) {
    const subject = T.data.people.find((p) => !p.living);
    T.select(subject.id);
    await sleep(70);
    const picks = [...doc.querySelectorAll('[data-media]')];
    ok('a deceased person can be offered photographs', picks.length === cat.length,
       `${picks.length} of ${cat.length}`);

    const target = picks.find((b) => !b.checked);
    const had = (T.data.people.find((p) => p.id === subject.id).media || []).length;
    target.checked = true;
    target.dispatchEvent(new win.Event('change', { bubbles: true }));
    await sleep(110);
    ok('ticking attaches the photograph',
       (T.data.people.find((p) => p.id === subject.id).media || []).length === had + 1);

    T.select(subject.id);
    await sleep(70);
    const untick = [...doc.querySelectorAll('[data-media]')]
      .find((b) => b.dataset.media === target.dataset.media);
    untick.checked = false;
    untick.dispatchEvent(new win.Event('change', { bubbles: true }));
    await sleep(110);
    ok('unticking detaches it again',
       (T.data.people.find((p) => p.id === subject.id).media || []).length === had);

    // A living person is never offered the list at all.
    const someoneLiving = T.data.people.find((p) => p.living);
    T.select(someoneLiving.id);
    await sleep(70);
    ok('a living person is offered no photographs',
       doc.querySelectorAll('[data-media]').length === 0);

    // And a photograph forced onto one is caught before it can publish.
    const rigged = JSON.parse(JSON.stringify(E.buildPayload()));
    const victimId = rigged.people.find((p) => p.living).id;
    rigged.people.find((p) => p.id === victimId).media = [cat[0].file];
    ok('verify() catches a photograph on a living person',
       E.verify(rigged).some((m) => /photograph/.test(m)));
  } else {
    ok('photograph catalogue present', false, 'no media.json loaded');
  }

  // ── uploading ─────────────────────────────────────────────────────────────
  // Build a real JPEG in the page, with EXIF containing GPS, and push it through
  // the actual upload path.
  function makeJpegWithExif(win) {
    return new Promise((resolve) => {
      const c = win.document.createElement('canvas');
      c.width = 3000; c.height = 2000;            // oversized on purpose
      const g = c.getContext('2d');
      g.fillStyle = '#8c5a2b'; g.fillRect(0, 0, 3000, 2000);
      g.fillStyle = '#fff'; g.fillRect(100, 100, 900, 700);
      c.toBlob((blob) => blob.arrayBuffer().then((buf) => {
        const jpeg = new Uint8Array(buf);
        // Splice an APP1/Exif segment in after SOI so there is something to strip.
        const tag = new TextEncoder().encode('Exif\0\0GPSLatitude 65.0 GPSLongitude 25.5');
        const seg = new Uint8Array(4 + tag.length);
        seg[0] = 0xFF; seg[1] = 0xE1;
        seg[2] = ((tag.length + 2) >> 8) & 0xFF; seg[3] = (tag.length + 2) & 0xFF;
        seg.set(tag, 4);
        const out = new Uint8Array(2 + seg.length + (jpeg.length - 2));
        out.set(jpeg.subarray(0, 2), 0);
        out.set(seg, 2);
        out.set(jpeg.subarray(2), 2 + seg.length);
        resolve(new win.File([out], 'Briitta kotona 2024.jpg', { type: 'image/jpeg' }));
      }), 'image/jpeg', 0.95);
    });
  }

  const catBefore = (T.media.items || []).length;
  const file = await makeJpegWithExif(win);
  const asText = new TextDecoder().decode(new Uint8Array(await file.arrayBuffer()));
  ok('the test image really does carry EXIF GPS', asText.includes('GPSLatitude'));

  const staged = await E.stageUpload(file, { caption: 'A test photograph', kind: 'portrait' });
  ok('staging adds it to the catalogue', (T.media.items || []).length === catBefore + 1);
  ok('it is queued, not yet published', E.pending.length === 1);

  const entry = staged.entry;
  ok('the uploaded filename is generated, not taken from the file',
     !/briitta|kotona|2024/i.test(entry.file), entry.file);
  ok('the generated name is URL-safe', /^[a-z0-9.\-]+$/.test(entry.file), entry.file);
  ok('the caption is what was typed', entry.caption === 'A test photograph');

  const processed = new TextDecoder().decode(
    Uint8Array.from(atob(E.pending[0].base64), (c) => c.charCodeAt(0)));
  ok('EXIF is gone from what would be uploaded', !processed.includes('GPSLatitude'));
  ok('the image was downscaled', entry.width <= 2000 && entry.height <= 2000,
     `${entry.width}x${entry.height}`);
  ok('and got smaller', entry.bytes < file.size, `${file.size} -> ${entry.bytes}`);

  // The same bytes twice must not become two files.
  const again = await E.stageUpload(await makeJpegWithExif(win),
    { caption: 'duplicate', kind: 'portrait' });
  ok('an identical image is recognised, not duplicated', !!again.skipped);

  // Attach it, then remove it, and confirm nothing dangles.
  const subj = T.data.people.find((p) => !p.living);
  T.select(subj.id);
  await sleep(80);
  const boxNew = [...doc.querySelectorAll('[data-media]')]
    .find((b) => b.dataset.media === entry.file);
  ok('a queued photograph can be attached straight away', !!boxNew);
  boxNew.checked = true;
  boxNew.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(110);
  ok('attaching a queued photograph works',
     (T.data.people.find((p) => p.id === subj.id).media || []).includes(entry.file));

  const mediaPayload = E.buildMediaPayload();
  ok('the catalogue payload drops browser-only fields',
     mediaPayload.items.every((m) => !('pending' in m) && !('dataUrl' in m)));
  ok('verify() accepts the tree plus catalogue together',
     E.verify(E.buildPayload(), mediaPayload).length === 0,
     E.verify(E.buildPayload(), mediaPayload).slice(0, 2).join(' | '));

  // A reference to a photograph that is not in the catalogue must be caught.
  const dangling = JSON.parse(JSON.stringify(E.buildPayload()));
  dangling.people.find((p) => !p.living).media = ['no-such-photo.jpg'];
  ok('verify() catches a reference to a missing photograph',
     E.verify(dangling, mediaPayload).some((m) => /not in the catalogue/.test(m)));

  E.removePhotograph(entry.file);
  await sleep(110);
  ok('removing takes it out of the catalogue',
     !(T.media.items || []).some((m) => m.file === entry.file));
  ok('removing unqueues it rather than queuing a delete',
     E.pending.length === 0 && E.deletes.size === 0);
  ok('and detaches it from everyone',
     !T.data.people.some((p) => (p.media || []).includes(entry.file)));

  // ── the payload that would be published ───────────────────────────────────
  const payload = E.buildPayload();
  ok('payload is flagged redacted', payload.redacted === true);
  ok('payload is flagged browser-edited', payload.editedInBrowser === true);

  const leaks = payload.people.filter((p) => p.living).filter((p) =>
    p.given || p.married || p.nick || p.occupation || p.geniId
    || p.birth || p.death || p.burial
    || (p.aka || []).length || (p.notes || []).length);
  ok('no living person in the payload carries data', leaks.length === 0,
     leaks.map((p) => p.id).join(','));
  ok('verify() passes on a clean payload', E.verify(payload).length === 0,
     E.verify(payload).slice(0, 2).join(' | '));

  // ── verify() must actually catch a violation, not just pass ───────────────
  const tampered = JSON.parse(JSON.stringify(payload));
  const victim = tampered.people.find((p) => p.living);
  victim.given = 'Smuggled';
  victim.birth = { date: { source: '14 MAR 2019', display: '1 December 2021',
                           year: 2021, precision: 'day' }, place: 'Tampere', asserted: false };
  const caught = E.verify(tampered);
  ok('verify() catches smuggled given names', caught.some((m) => /given/.test(m)));
  ok('verify() catches smuggled birth records', caught.some((m) => /birth/.test(m)));

  const broken = JSON.parse(JSON.stringify(payload));
  broken.people[0].parentFamily = '@NOPE@';
  ok('verify() catches a dangling family pointer',
     E.verify(broken).some((m) => /does not exist/.test(m)));

  // ── UTF-8 commit encoding: btoa() alone would throw on ä/ö ────────────────
  let encoded = null, threw = null;
  try { encoded = win.btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }
  catch (e) { threw = e.message; }
  ok('payload with Finnish characters is encodable', !!encoded && !threw, threw || '');
  ok('payload really does contain non-ASCII',
     /[äöÄÖ]/.test(JSON.stringify(payload)));

  // ── withholding a person ──────────────────────────────────────────────────
  const subject = T.data.people.find(
    (p) => !p.living && p.given && p.notes && p.notes.length);
  T.select(subject.id);
  await sleep(60);
  const vbody = doc.getElementById('panel-body');

  ok('the form offers a visibility level', !!vbody.querySelector('[name="vis-level"]'));
  ok('the form offers per-field withholding', !!vbody.querySelector('[data-hide]'));
  ok('the form previews what a visitor sees', !!vbody.querySelector('.vis-preview'));

  // Withhold one field, and check it is the only thing that goes.
  const occBox = vbody.querySelector('[data-hide="occupation"]');
  occBox.checked = true;
  occBox.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(80);

  let out = E.redactForPublication();
  let shown = out.people.find((p) => p.id === subject.id);
  ok('a withheld occupation does not reach the public tree', !shown.occupation);
  ok('withholding one field leaves the rest', !!shown.given && !!shown.notes.length);
  ok('the working copy still holds the withheld value',
     T.data.people.find((p) => p.id === subject.id).occupation
       === subject.occupation || !subject.occupation);

  // Now withhold the person entirely.
  T.select(subject.id);
  await sleep(60);
  const hideRadio = doc.getElementById('panel-body')
    .querySelector('[name="vis-level"][value="hidden"]');
  hideRadio.checked = true;
  hideRadio.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(90);

  out = E.redactForPublication();
  shown = out.people.find((p) => p.id === subject.id);
  ok('a withheld person keeps no name', shown.name === 'Withheld' && !shown.surname);
  ok('a withheld person keeps no given name', !shown.given);
  ok('a withheld person keeps no dates',
     !shown.birth && !(shown.death && shown.death.date));
  ok('a withheld person keeps no notes or photographs',
     !shown.notes.length && !shown.media.length && !shown.photo);
  ok('a withheld person keeps no sex', shown.sex === 'U');
  ok('a withheld person keeps their place in the tree',
     shown.parentFamily === subject.parentFamily);
  ok('the whole payload still verifies with someone withheld',
     E.verify(E.buildPayload(), E.buildMediaPayload()).length === 0,
     E.verify(E.buildPayload(), E.buildMediaPayload()).join(' | '));

  const withheldCard = doc.querySelector(`.node[data-id="${CSS.escape(subject.id)}"]`)
    || [...doc.querySelectorAll('.node')].find((n) => n.dataset.id === subject.id);
  ok('the withheld card is drawn but unlabelled',
     !!withheldCard && withheldCard.classList.contains('withheld')
     && !/[A-Za-zÄÖäö]{3}/.test(
          [...withheldCard.querySelectorAll('.nm')].map((t) => t.textContent).join('')
            .replace(/withheld/i, '')));

  // Withholding must never be a display-only trick: prove the value is absent
  // from the bytes that would actually be committed, not merely undrawn.
  const wire = JSON.stringify(E.buildPayload());
  ok('the withheld name is absent from the serialised payload',
     !wire.includes(subject.given), subject.given);

  // Put them back.
  T.select(subject.id);
  await sleep(60);
  const showRadio = doc.getElementById('panel-body')
    .querySelector('[name="vis-level"][value="public"]');
  showRadio.checked = true;
  showRadio.dispatchEvent(new win.Event('change', { bubbles: true }));
  await sleep(90);
  shown = E.redactForPublication().people.find((p) => p.id === subject.id);
  ok('un-withholding restores the record', shown.name === subject.name);
  ok('un-withholding does not silently restore a separately withheld field',
     !shown.occupation);

  // ── a draft survives a reload ─────────────────────────────────────────────
  ok('draft was written to localStorage',
     !!win.localStorage.getItem('familyArchive.draft.v1'));

  // ── no token was needed to get this far, and none was stored ──────────────
  ok('no token stored by merely editing',
     !win.localStorage.getItem('familyArchive.token.v1')
     && !win.sessionStorage.getItem('familyArchive.token.v1'));

  report(results);
})().catch((e) => {
  document.getElementById('log').textContent = 'THREW: ' + e.stack;
  document.title = 'THREW';
  report(['FAIL  harness threw :: ' + String(e.message)]);
});

// Canvas encoding never completes under --virtual-time-budget, so this suite
// has to run in real time — and a real-time headless Chrome gives no reliable
// moment to read the DOM. Reporting back through the server's access log is the
// one channel that always survives.
function report(lines) {
  document.getElementById('log').textContent = lines.join('\n');
  const failed = lines.filter((r) => r.startsWith('FAIL')).length;
  document.title = `DONE ${lines.length - failed}/${lines.length}`;
  const payload = encodeURIComponent(
    `${lines.length - failed}/${lines.length}::` +
    lines.filter((r) => r.startsWith('FAIL')).join(' ;; ').slice(0, 900));
  fetch(`/__result__?suite=${SUITE}&r=${payload}`).catch(() => {});
}
</script>
