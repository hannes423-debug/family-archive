notes:
  - |
    Hypothesis H4: he is the "Matti" of Briitta Liisa **Matintytär** Talvensaari
    (1875-1952), whose portrait the family holds. A daughter Liisa appears in his
    death notice paired with Anselm Talvensaari, and Briitta Liisa's patronymic
    means "Matti's daughter". Both fit; neither proves it. Matti was an
    extremely common name and Kemijärvi is not a small parish.
  - |
    He held a named house — the notice places his death at "Autioniemen talossa"
    in Ylikylä. HisKi records no Autioniemi events before 1860, which fits
    Autioniemi being a later settler farm rather than an old established one.

