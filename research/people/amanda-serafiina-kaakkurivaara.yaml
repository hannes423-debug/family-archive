notes:
  - |
    CONFLICT, UNRESOLVED — the maiden name.
    The photograph's filename says **Sipovaara**. The gravestone in that same
    photograph plainly reads **"AMANDA SEREFIA o.s. PERÄLÄ"** — "o.s." being
    *omaa sukua*, i.e. née. The stone also gives Serefia, not Serafiina.

    Both are genuine Kemijärvi farm names, but not from the same place: HisKi
    puts every 19th-century Sipovaara event in Storby/Isokylä, while the
    Kaakkurivaara and Talvensaari families are all in Öfverby/Ylikylä.

    A gravestone is normally the better witness for a maiden name — it was
    commissioned by people who knew her. But it is late evidence, and a woman
    who married twice, or who was born on one farm and raised on another, can
    honestly be recorded under either name. Do not overwrite one with the other;
    find the 1899 marriage record, which will give her name as of that day.
  - |
    Deliberately filed under her married name so that neither candidate maiden
    name is silently adopted as fact.

