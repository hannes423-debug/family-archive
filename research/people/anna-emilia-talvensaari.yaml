notes:
  - |
    CONFLICT, UNRESOLVED — the patronymic versus the death notice.
    A family photograph is captioned "Briitta Liisa Matintytär Talvensaari
    1875-1952", and the 1930 Autioniemi death notice lists "Anselm ja Liisa
    Talvensaari" among the mourners. Read together these suggest Liisa was a
    daughter of Matti Autioniemi who married a Talvensaari — and if that
    Talvensaari was Anselm, then Liisa is NOT this woman's mother, because this
    woman is Matias's daughter, not Anselm's.
    Three ways out, none yet supported: (a) Liisa is an aunt, not the mother;
    (b) her husband carried both names, e.g. Matias Anselm, and was known by the
    second; (c) the caption or the notice is wrong. Do not pick one without the
    1917 birth record.
  - |
    If H4 did hold, her mother would have been 42 at her birth and married 19
    years earlier — making her a youngest child of a large family. Consistent,
    but consistency is not evidence.

